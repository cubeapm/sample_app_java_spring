version: "3"
services:
  java:
    build:
      context: .
    container_name: cube_java_springboot
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:./dd-java-agent.jar

      - DD_SERVICE=cube_sample_java_spring_boot_datadog
      # send traces to CubeAPM
      - DD_TRACE_AGENT_URL=http://host.docker.internal:3130

      # optional settings
      # - DD_ENV=myenv
      # - DD_VERSION=1.2.3
      # - DD_TAGS=mykey1:myvalue1,mykey2:myvalue2

      # Print Datadog tracer startup logs on screen
      # - DD_TRACE_STARTUP_LOGS=true
      # Enable Datadog tracer debug logging if needed to see detailed logs
      # - DD_TRACE_DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - datadog-agent
    restart: always

  mysql:
    image: mysql:8.0
    container_name: cube_java_springboot_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - cube_java_springboot_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: cube_java_springboot_redis
  
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest   # or datadog/agent:latest
    container_name: datadog-agent
    environment:
      # Required
      - DD_API_KEY=a210d52525896d8cc6f8547debe8affd                # your Datadog API key
      - DD_SITE=ap1.datadoghq.com          # change to datadoghq.eu or datadoghq.in if needed
      - DD_DD_URL=http://host.docker.internal:3130

      # Metrics
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true      # accept DogStatsD metrics from other containers
      - DD_DOGSTATSD_PORT=8125

      # APM / Traces
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_APM_RECEIVER_PORT=8126
      - DD_OBSERVABILITY_PIPELINES_WORKER_TRACES_URL=http://host.docker.internal:3130
      - DD_OBSERVABILITY_PIPELINES_WORKER_TRACES_ENABLED=true

    ports:
      - "8125:8125/udp"    # DogStatsD (metrics)
      - "8126:8126/tcp"    # APM traces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro


volumes:
  cube_java_springboot_mysql:
