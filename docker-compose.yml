version: "3"
services:
  java:
    build:
      context: .
    container_name: cube_java_springboot
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:./elastic-apm-agent.jar

      - ELASTIC_APM_SERVICE_NAME=cube_sample_java_spring_boot_elastic
      - ELASTIC_APM_SERVER_URL=http://host.docker.internal:3130

      # optional settings
      # Elastic agent sets environment from NODE_ENV by default
      # - ELASTIC_APM_ENVIRONMENT=UNSET
      # - ELASTIC_APM_SERVICE_VERSION=1.2.3
      # - ELASTIC_APM_GLOBAL_LABELS=mykey1=myvalue1,mykey2=myvalue2

      # Print Elastic agent logs on screen
      # - ELASTIC_APM_LOG_FILE=stdout
      # Set Elastic agent log level to debug if needed to see detailed logs
      # - ELASTIC_APM_LOG_LEVEL=debug
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    restart: always

  mysql:
    image: mysql:8.0
    container_name: cube_java_springboot_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - cube_java_springboot_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: cube_java_springboot_redis

volumes:
  cube_java_springboot_mysql:
