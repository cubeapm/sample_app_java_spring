version: "3"
services:
  java:
    build:
      context: .
    container_name: cube_java_springboot
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    restart: always

  java2:
    build:
      context: .
    container_name: cube_java_springboot2
    environment:
      - SERVER_PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      - mysql
      - redis
    restart: always

  mysql:
    image: mysql:8.0
    container_name: cube_java_springboot_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test
    volumes:
      - cube_java_springboot_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine3.18
    container_name: cube_java_springboot_redis

volumes:
  cube_java_springboot_mysql:
