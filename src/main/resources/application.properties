#mysql
spring.datasource.url=jdbc:mysql://mysql-host:3306/test?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# Postgres
postgres.datasource.url=jdbc:postgresql://postgres-host:5432/test
postgres.datasource.username=root
postgres.datasource.password=root

# Redis Config
spring.cache.type=redis
spring.data.redis.host=redis-host
spring.data.redis.port=6379

# Downstream HTTP services
node.service.url=http://node-host:8001
python.service.url=http://python-host:8002
php.service.url=http://php-host:8003
dotnet.service.url=http://dotnet-host:8004

# Kafka
spring.kafka.bootstrap-servers=kafka-host:9092
app.kafka.topic1=topic-1
app.kafka.topic2=topic-2

# RabbitMQ
spring.rabbitmq.host=rabbitmq-host
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
app.rabbitmq.queue1=topic-1
app.rabbitmq.queue2=topic-2

server.port=8000
server.error.path=/spring-error
