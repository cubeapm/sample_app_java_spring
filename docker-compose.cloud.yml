# Overlay when nested Docker cannot give containers IPs on a user bridge.
# All services share the VM network namespace and resolve *-host via extra_hosts.
# Applied automatically by stack.sh when cloud-docker.sh writes tmp/cloud-net-mode=host.

x-cloud-hosts: &cloud-hosts
  - "mysql-host:127.0.0.1"
  - "postgres-host:127.0.0.1"
  - "redis-host:127.0.0.1"
  - "kafka-host:127.0.0.1"
  - "rabbitmq-host:127.0.0.1"
  - "java-host:127.0.0.1"
  - "node-host:127.0.0.1"
  - "python-host:127.0.0.1"
  - "php-host:127.0.0.1"
  - "dotnet-host:127.0.0.1"
  - "datadog-agent:127.0.0.1"
  - "kafka:127.0.0.1"

x-host-svc: &host-svc
  network_mode: host
  extra_hosts: *cloud-hosts
  ports: !reset
  networks: !reset

services:
  java:
    <<: *host-svc
  node:
    <<: *host-svc
  python:
    <<: *host-svc
  php:
    <<: *host-svc
  dotnet:
    <<: *host-svc
  datadog-agent:
    <<: *host-svc
  mysql:
    <<: *host-svc
  postgres:
    <<: *host-svc
  redis:
    <<: *host-svc
  kafka:
    <<: *host-svc
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:29093
  rabbitmq:
    <<: *host-svc
